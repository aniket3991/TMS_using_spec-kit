spring.application.name=tms-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/root}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:toor}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api/v1/openapi.json
